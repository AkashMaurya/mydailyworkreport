{% extends "base.html" %}
{% block title %}Error {{ code }} — WorkLog{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto text-center py-16">
  <div class="inline-flex w-16 h-16 rounded-2xl bg-ink-900 text-white items-center justify-center text-2xl font-bold">{{ code }}</div>
  <h1 class="font-display text-2xl font-semibold text-ink-900 mt-4">{{ message }}</h1>
  <a href="{{ url_for('index') }}" class="inline-flex mt-6 px-5 py-2.5 rounded-xl bg-ink-900 text-white text-sm font-semibold">Go home</a>
</div>
{% endblock %}
